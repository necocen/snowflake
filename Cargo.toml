[package]
name = "snowflake-rs"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.89"
bevy = "0.15.0"
bevy_egui = "0.31.1"
cfg-if = "1.0.0"
chrono = "0.4.38"
csv = "1.3.0"
fnv = "1.0.7"
ndarray = { version = "0.16.1", features = ["rayon"] }
ndarray-rand = "0.15.0"
resvg = "0.43.0"
serde = { version = "1.0.210", features = ["derive"] }
stl_io = "0.8.2"
svg = "0.17.0"
tracing = "0.1.40"

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2.99"
wasm-bindgen-rayon = { version = "1.2.2", features = ["no-bundler"] }

[profile.release-wasm]
panic = "abort"
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
