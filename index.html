<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta property="og:locale" content="en_US" />
        <meta property="og:locale:alternate" content="ja_JP" />
        <meta property="og:title" content="Snowflake Simulator" />
        <meta property="og:description" content="A program that simulates the growth of snow crystals" />
        <meta property="og:description:ja_JP" content="雪の結晶成長をシミュレイションします" />
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://yuki.necocen.info/" />
        <meta property="og:image" content="https://yuki.necocen.info/ogp.png" />
        <meta property="twitter:card" content="summary_large_image" />
        <meta property="twitter:site" content="@necocen">
        <title>Snowflake Simulator</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
            #text-display {
                position: fixed;
                bottom: 10px;
                right: 10px;
                z-index: 10;
                background-color: rgba(128, 128, 128, 0.7);
                color: white;
                padding: 8px 12px;
                border-radius: 4px;
                font-size: 14px;
                font-family: -apple-system, Roboto, sans-serif;
            }
            #text-display a {
                color: white;
                text-decoration: underline;
            }
            html,
            body {
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
        </style>
    </head>
    <body>
        <div id="text-display">Snowflake Simulator<br>GitHub: <a href="https://github.com/necocen/snowflake" target="_blank">necocen/snowflake</a></div>
        <script type="module">
            import init, { initThreadPool, run } from "./pkg/snowflake_rs.js";

            try {
                await init();
                console.log("WASM initialized");
                await initThreadPool(navigator.hardwareConcurrency);
                console.log("Web Workers initialized");
                await run();
            } catch (error) {
                if (
                    !error.message.startsWith(
                        "Using exceptions for control flow, don't mind me. This isn't actually an error!",
                    )
                ) {
                    throw error;
                }
            }
        </script>
    </body>
</html>
